<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Changelog Component</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="changelog-card">
    <!-- Header Section -->
    <header class="changelog-header">
      <h1>Changelog</h1>
      <p>Here's everything we have shipped in the past few days</p>
    </header>

    <!-- Timeline Section -->
    <div class="timeline">
      <!-- Each timeline item -->
      <div class="timeline-item">
        <span class="date">September 3, 2024</span>
        <div class="dot"></div>
        <span class="title">Announcing Projects on Frontend Roadmap</span>
      </div>
      <div class="timeline-item">
        <span class="date">August 28, 2024</span>
        <div class="dot"></div>
        <span class="title">Build your learning habits with learning streaks</span>
      </div>
    </div>

    <!-- Button Section -->
    <div class="button-container">
      <button>Visit Complete Changelog</button>
    </div>
  </div>

</body>
</html>
